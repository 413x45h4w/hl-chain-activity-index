# Hyperliquid perp -> native chain mapping.
# Review this file when a new perp appears. sync never guesses a chain;
# unknown tickers are appended with status: unmapped.
version: 1
updated: '2026-11-22T22:02:24Z'
hl_universe_size: 235
policy:
  stablecoins: A perp is excluded only when the token itself is a stablecoin. Governance tokens of stablecoin
    issuers (ENA, SKY, USUAL, and similar) stay in. Failed pegs that were issued as stablecoins (USTC)
    stay out. Price near $1 is not enough on its own, and a ticker that merely contains STABLE is not
    enough.
  k_prefix: A ticker matching k + Uppercase (kPEPE, kBONK) is Hyperliquid's 1000-unit contract on the
    underlying token. The chain is the underlying token's chain. KAS is not a k-prefix.
  native_vs_hosted: asset_role native means the coin is the chain's gas or staking asset. hosted means
    it was issued on that chain (ERC-20, SPL, jetton, BRC-20, HIP-1) while another asset pays gas. A bridged
    representation on a second chain does not move the mapping when a home chain is documented (lock-and-release
    home, gas token, or a single CoinGecko asset_platform_id).
  unmapped: If the home chain is unknown, or two chains are co-equal official issuances, the coin is status
    unmapped. sync never fills that in from a name or a market-cap guess.
  prices: USD conversions use Hyperliquid allMids only. USDC, the HL quote asset, is 1 when a chain's
    gas token is USDC and allMids has no USDC row.
  kraken_list_as_of: '2026-10-30'
