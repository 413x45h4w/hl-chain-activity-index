# Chain registry: collector, free endpoints, and what minute-level data can mean.
# Activity categories that a run could not fill are null in the sample, with a reason.
version: 1
updated: '2026-11-22T22:02:24Z'
chains:
- id: bitcoin
  name: Bitcoin
  gas_ticker: BTC
  collector: utxo_mempool
  minute_feasible: false
  minute_note: Confirmed activity is one block every ~10 minutes. The collector polls mempool size every run and
    records each new block; the per-minute rate is the block's tx count divided by the measured block interval.
  endpoints:
  - https://mempool.space/api
