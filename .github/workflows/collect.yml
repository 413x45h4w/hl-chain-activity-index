name: collect-activity

# GitHub-hosted cron cannot run every minute. The platform interval is five
# minutes and the start time drifts. Minute collection is the local runner:
#   python -m hl_activity run --interval 60
# This workflow is a coarse backup plus a manual run. It does not commit
# history back to the branch; it uploads the append-only store as an artifact
# so a reviewer can see the pass without a bot rewriting main.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Refresh mapping flags and collect one pass
        run: python -m hl_activity all --workers 8
      - uses: actions/upload-artifact@v4
        with:
          name: activity-history
          path: |
            mapping/universe.yaml
            mapping/universe.csv
            data/history
            data/derived
            dashboard/index.html
          if-no-files-found: error
